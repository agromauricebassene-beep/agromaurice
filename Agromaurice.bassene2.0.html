<h1>Agromaurice.bassene</h1>
<p class="lead">Guide pour créer une ferme intégrée semi-intensive au Sénégal : pisciculture, élevage et maraîchage qui se nourrissent l’un l’autre.<br><small>Auteur : Maurice Ayaboureul BASSENE</small></p>
<nav id="nav"></nav>
<div id="v"></div>
<footer>© 2026 Maurice Ayaboureul BASSENE — Tous droits réservés. Voir l’onglet « Droit d’auteur ».</footer>
</main>
<script>
var AN=[
["🐓","Poulet local","Chair et œufs",
"Poulailler sur terrain sec et surélevé, à l’abri du vent. Murs en banco ou grillage, toit en tôle ou paille, ventilation haute, litière de balle de riz ou coques d’arachide. 3 à 5 poules/m², perchoirs, 1 pondoir pour 4 à 5 poules, parcours clôturé et ombragé.",
"Parcours (insectes, graines) + maïs, mil, son, tourteau d’arachide, feuilles de moringa, coquilles broyées. Eau propre en continu.",
"1 coq pour 8 à 10 poules. Couvaison 21 jours (10 à 12 œufs par poule). Poussins au chaud et au sec les premières semaines.",
"Vaccin Newcastle selon le calendrier du vétérinaire, vide sanitaire entre bandes, quarantaine des nouveaux, abreuvoirs lavés chaque jour.",
"Bac de cendre de bois contre les poux ; jus d’aloès ou macération de feuilles de neem (une poignée dans 1 L d’eau, 12 h, filtrée) dans l’eau de boisson 3 jours en soutien. Mortalité ou diarrhée sanglante : vétérinaire."],
["🐖","Porc","Engraissement, naissage",
"Porcherie ombragée, à 50 m ou plus des habitations, sol en béton ou banco damé en pente, murets de 1 m, double clôture. 1 à 1,5 m²/porc à l’engraissement, 6 à 8 m² par truie avec loge de mise bas, pédiluve à l’entrée.",
"Aliment équilibré par phases (maïs, son, tourteau, complément minéral). Sous-produits et restes de cuisine toujours bouillis. Eau fraîche à volonté.",
"Gestation : 3 mois, 3 semaines, 3 jours. Loge de mise bas propre ; porcelets au chaud, colostrum, sevrage vers 6 à 8 semaines.",
"Peste porcine africaine : pas de vaccin, biosécurité totale (pédiluve, quarantaine, aucun contact avec porcs extérieurs). Déparasitage régulier. Signaler toute mortalité brutale.",
"Graines de papaye pilées dans l’aliment contre les vers. Aucun remède traditionnel ne soigne la peste porcine : isolement et services vétérinaires."],
["🐑","Mouton","Embouche, Tabaski",
"Bergerie ouverte sur les côtés, toit en tôle ou chaume, sol sec ou plancher en lattes surélevé, mangeoires hautes, abreuvoirs. 1 à 1,5 m²/tête, enclos de repos et parcours clôturé.",
"Fourrages (herbe, foin, paille traitée, feuilles de Leucaena, Acacia) + concentrés (son, tourteau d’arachide) introduits progressivement. Pierre à lécher, eau propre.",
"1 bélier pour 20 à 30 brebis. Gestation d’environ 5 mois. Colostrum aux agneaux, sevrage vers 3 mois.",
"Vaccination PPR et pasteurellose selon les campagnes, déparasitage, parage des onglons, quarantaine des animaux achetés.",
"Feuilles de neem en complément et graines de papaye contre les vers ; tisane de feuilles de goyavier en cas de diarrhée légère. Au-delà, vétérinaire."],
["🐐","Chèvre","Viande, lait",
"Abri surélevé en planches, sec, clôture de 1,5 m, râteliers hors du sol, 1 à 1,5 m²/tête, protégé de l’humidité et du vent.",
"Feuilles et arbustes (Leucaena, moringa, Acacia), foin, résidus de culture, concentré pour femelles gestantes ou allaitantes, pierre à lécher, eau.",
"1 bouc pour 20 à 25 chèvres. Gestation 5 mois, jumeaux fréquents (Djallonké). Colostrum et chaleur pour les chevreaux.",
"Parasites internes = risque n°1 : vermifugation raisonnée, vaccin PPR, parage, fumier retiré souvent, pâturage tournant.",
"Graines de papaye et feuilles de neem en complément contre les vers. Avis vétérinaire avant tout traitement."],
["🦆","Canard","Viande, robuste",
"Abri sec et ventilé, litière épaisse, 3 à 4 canards/m², parcours avec petit point d’eau, clôture anti-prédateurs, pondoirs bas.",
"Parcours (herbes, insectes, escargots) + céréales, son, tourteau, verdure. Canetons : aliment riche en protéines, eau à portée.",
"1 mâle pour 5 à 8 femelles. Incubation 28 jours (Pékin) à 35 jours (Barbarie). Canetons au chaud et au sec.",
"Litière propre, aliments non moisis, calendrier vaccinal du vétérinaire, séparer des poules en cas de maladie.",
"Macération de feuilles de neem dans l’eau de boisson en soutien, comme pour le poulet ; aliments secs et sains en prévention."],
["🐇","Lapin","Viande, peu d’espace",
"Clapier en grillage surélevé de 80 cm, à l’ombre, toit en tôle ou paille. Cage de 0,5 m² par femelle avec boîte à nid, cages d’engraissement, abreuvoirs, courant d’air sans vent direct.",
"Fourrage frais ou foin (herbes, feuilles de patate douce, moringa) à volonté + granulés ou son et tourteau. Jamais d’aliment mouillé ou moisi.",
"Gestation d’environ 31 jours ; nid de paille avant mise bas ; sevrage à 5 à 6 semaines ; vente vers 3 à 4 mois.",
"Cages nettoyées chaque jour, ombre, vaccins (myxomatose, maladie hémorragique) si disponibles, surveillance des diarrhées, oreilles et rhume.",
"Foin sec et feuilles de goyavier séchées en cas de diarrhée légère ; supprimer le vert humide. Si le lapin ne mange plus, consulter."]
];
var PI=[
["🐟","Silure africain","Clarias gariepinus",
"Bassin en béton, hors-sol bâché ou étang en terre d’environ 1 m de profondeur, arrivée et vidange d’eau, filet de couverture solide (le silure s’échappe), clôture contre les oiseaux.",
"Granulés riches en protéines, 2 à 3 repas par jour (environ 3 à 5 % du poids), ajustés à la température ; ne pas surnourrir.",
"Alevins achetés en écloserie fiable. Trier les tailles régulièrement : le silure est cannibale. Cycle de 5 à 8 mois.",
"Eau à 25 à 30 °C, pH 6,5 à 8,5, renouvellement, chaulage du bassin vide, retrait des poissons morts.",
"Bain de sel court contre les parasites externes (dose à valider avec un technicien aquacole). Aucune posologie traditionnelle validée."],
["🐠","Tilapia","Oreochromis niloticus",
"Étang en terre argileuse ou bassin béton/bâché de 1 à 1,5 m de profondeur, arrivée, trop-plein et vidange, filet anti-oiseaux, berges inclinées.",
"Granulés 2 à 3 repas par jour (≈ 2 à 5 % du poids), un peu de fumier composté pour le plancton, avec modération.",
"Alevins mâles ou inversés pour éviter la surpopulation. Cycle de 5 à 8 mois, tri des tailles.",
"Surveiller l’oxygène (poissons en surface = alerte), eau verte, nettoyage, chaux, quarantaine des alevins.",
"Renouveler l’eau d’abord ; bain de sel court contre les parasites externes avec avis du technicien."]
];
var VE=[
["🧅","Oignon","Pépinière de 40 à 50 jours puis repiquage à 10 × 10 cm ; cycle de 3 à 4 mois ; réduire l’arrosage avant récolte, sécher à l’ombre.","Thrips, pourriture, mildiou : rotation, planches aérées, pas d’excès d’eau."],
["🍅","Tomate","Pépinière 3 à 4 semaines, repiquage à 50 × 60 cm, tuteurage, paillage, arrosage régulier au pied ; récolte dès 2 à 3 mois.","Flétrissement, mildiou, mouche blanche, chenilles : rotation de 3 ans, paillage, ne pas mouiller les feuilles."],
["🌶️","Piment","Pépinière 4 à 5 semaines, repiquage à 50 × 50 cm, compost, récolte échelonnée.","Pucerons, acariens, flétrissement : savon noir + neem, rotation."],
["🥬","Laitue","Pépinière 3 semaines, repiquage à 25 × 25 cm, arrosage léger et fréquent, ombrage en saison chaude, récolte en 40 à 60 jours.","Pucerons, pourriture du collet : ne pas enterrer le collet, arroser au pied."],
["🥒","Concombre","Semis direct en poquets à 60 × 100 cm, palissage, arrosage régulier, récolte vers 2 mois.","Oïdium, mildiou, mouche des fruits : aération, rotation, retirer les fruits atteints."],
["🫑","Poivron","Pépinière 5 à 6 semaines, repiquage à 50 × 50 cm, compost et paillage, récolte après 2,5 à 3 mois.","Flétrissement, pucerons, pourriture apicale (eau irrégulière) : arrosage régulier."],
["🌱","Navet","Semis direct en lignes espacées de 20 à 25 cm, éclaircir à 10 cm, récolte en 50 à 70 jours.","Altises, pourriture : moustiquaire de protection, rotation."],
["🍠","Taro","Plantation de cormes ou rejets en sol frais et humide, à 60 × 80 cm, buttage, paillage, cycle de 7 à 10 mois.","Pourriture du corme (sol détrempé), mildiou : bon drainage, plants sains, rotation."]
];
var RE=[["Neem","250 g de feuilles pilées (ou 100 g de graines) dans 5 L d’eau, 12 h, filtrer, ajouter 1 cuillère de savon noir. Pulvériser le soir contre pucerons, chenilles, mouches blanches."],
["Piment-ail","100 g de piment et 100 g d’ail pilés dans 1 L d’eau, 24 h, filtrer, diluer 1 pour 10. Contre insectes mangeurs de feuilles."],
["Savon noir","1 cuillère à soupe dans 1 L d’eau contre pucerons et cochenilles."],
["Cendre de bois","Poudrer légèrement le sol et la base des plants contre fourmis et altises."]];
var V=document.getElementById("v"),N=document.getElementById("nav");
function det(a,c){return '<details class="'+c+'"><summary><span class="pic">'+a[0]+'</span><span><b>'+a[1]+'</b><small>'+a[2]+'</small></span></summary><div class="bd">'+pic(a[0],a[1],c||"ani")+'<h3>Construction de l’habitat</h3><p>'+a[3]+'</p><h3>Alimentation</h3><p>'+a[4]+'</p><h3>Reproduction</h3><p>'+a[5]+'</p><h3>Santé : prophylaxie</h3><p>'+a[6]+'</p><h3>Santé : usage traditionnel rapporté</h3><p>'+a[7]+'</p></div></details>'}
var NT='<div class="note">Usages traditionnels rapportés, non validés scientifiquement : à tester sur peu d’animaux et à faire confirmer par un vétérinaire. Chiffres indicatifs à adapter à votre zone. N’utilisez jamais les graines de <i>Senna occidentalis</i> (Padja Santa), toxiques pour les animaux.</div>';
function schema(){
var n=[["Maraîchage",350,45],["Compost",350,170],["Poules, canards",100,95],["Lapins",100,245],["Mouton, chèvre",600,95],["Porc",600,245],["Bassins poissons",350,330]],
e=[[2,1],[3,1],[4,1],[5,1],[1,0],[0,2],[0,3],[6,0],[0,4]],s='<svg viewBox="0 0 700 390" role="img" aria-label="Schéma des flux de la ferme intégrée"><defs><marker id="m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--mute)"/></marker></defs>';
e.forEach(function(k){var a=n[k[0]],b=n[k[1]],dx=b[1]-a[1],dy=b[2]-a[2],L=Math.sqrt(dx*dx+dy*dy),u=(L-34)/L,v=34/L;s+='<line class="ln" marker-end="url(#m)" x1="'+(a[1]+dx*v*.7)+'" y1="'+(a[2]+dy*v*.7)+'" x2="'+(a[1]+dx*u)+'" y2="'+(a[2]+dy*u)+'"/>'});
n.forEach(function(k){s+='<rect class="nd" x="'+(k[1]-70)+'" y="'+(k[2]-24)+'" width="140" height="48" rx="12"/><text class="tx" x="'+k[1]+'" y="'+(k[2]+5)+'">'+k[0]+'</text>'});
return s+'</svg>'}
var T={
"Accueil":function(){return '<div class="pil"><div><i>🐟</i><b>Pisciculture</b><br>Silure et tilapia</div><div><i>🐓</i><b>Élevage</b><br>Poulet, porc, mouton, chèvre, canard, lapin</div><div><i>🥬</i><b>Maraîchage</b><br>8 légumes</div><div><i>♻️</i><b>Compost</b><br>Le cœur de la ferme</div></div><h2>Modèle de ferme intégrée</h2><p class="lead">Les déjections des animaux alimentent le compost, le compost nourrit les légumes, les résidus de légumes nourrissent lapins et volailles, et l’eau des bassins arrose les planches.</p>'+schema()+'<div class="card"><h3>Comment lire le schéma</h3><ul><li>Animaux → compost : fumier et déjections (toujours compostés avant usage).</li><li>Compost → maraîchage : engrais organique pour les planches.</li><li>Maraîchage → volailles et lapins : feuilles, épluchures et résidus sains.</li><li>Bassins → maraîchage : eau de vidange riche en nutriments pour l’arrosage.</li></ul></div><h2>Les 5 étapes pour démarrer</h2><ol><li>Choisir un terrain sain avec eau toute l’année.</li><li>Commencer par un ou deux ateliers seulement.</li><li>Installer le compost et les planches avant les animaux.</li><li>Prendre contact avec un vétérinaire et les services de l’élevage et de l’aquaculture.</li><li>Tenir un registre des dépenses, soins et ventes.</li></ol>'},
"Élevage":function(){return NT+'<div class="grid">'+AN.map(function(a){return det(a,"")}).join("")+'</div>'},
"Pisciculture":function(){return NT+'<div class="grid">'+PI.map(function(a){return det(a,"fish")}).join("")+'</div>'},
"Maraîchage":function(){return '<h2>Installer une planche</h2><svg viewBox="0 0 420 150" role="img" aria-label="Schéma d’une planche"><rect x="20" y="10" width="110" height="130" fill="none"/><rect class="nd" x="150" y="10" width="110" height="130" rx="6"/><g stroke="var(--ac)" stroke-width="2"><path d="M175 20v110M205 20v110M235 20v110"/></g><rect x="20" y="10" width="110" height="130" fill="none"/><text class="tx" x="205" y="88">1 à 1,2 m</text><text class="tx" x="95" y="80">allée</text><text class="tx" x="95" y="96">40 à 50 cm</text><text class="tx" x="330" y="80">longueur 5 à 10 m</text></svg><div class="card"><ol><li>Orienter la planche nord-sud, près d’un point d’eau, avec clôture.</li><li>Largeur de 1 à 1,2 m (accessible des deux côtés), longueur de 5 à 10 m, allées de 40 à 50 cm.</li><li>Retirer cailloux et racines, bêcher sur 20 à 30 cm.</li><li>Incorporer 1 à 2 brouettées de compost mûr pour 10 m² et niveler.</li><li>Pépinière ou semis selon la culture, arrosage léger, puis paillage.</li><li>Faire tourner les familles de légumes d’un cycle à l’autre.</li></ol></div><h2>Les 8 cultures</h2><div class="grid">'+VE.map(function(a){return '<details class="veg"><summary><span class="pic">'+a[0]+'</span><span><b>'+a[1]+'</b><small>Production et prévention</small></span></summary><div class="bd">'+pic(a[0],a[1],"veg")+'<h3>Production</h3><p>'+a[2]+'</p><h3>Dates de production</h3><p>'+CL[a[1]][3]+'</p><h3>Maladies et prévention</h3><p>'+a[3]+'</p><h3>Traitement traditionnel</h3><p>Voir les recettes ci-dessous.</p></div></details>'}).join("")+'</div>'+calGrid()+'<h2>Traitements à base de plantes</h2><div class="note">Usages traditionnels rapportés : tester sur quelques plants, traiter le soir, porter des gants, éviter les yeux, et ne pas traiter juste avant la récolte.</div><div class="card">'+RE.map(function(r){return '<h3>'+r[0]+'</h3><p>'+r[1]+'</p>'}).join("")+'<h3>Prévention</h3><p>Rotation, paillage, planches aérées, association avec basilic ou œillet d’Inde, retrait des plants malades.</p></div>'},
"Compost":function(){return '<h2>Manuel de production de compost</h2><div class="card"><h3>1. Matières</h3><p><b>Brunes</b> (carbone) : paille, feuilles sèches, coques d’arachide, sciure. <b>Vertes</b> (azote) : résidus de légumes, herbe fraîche, fumier de lapin, chèvre, mouton ou volaille. Proportion : environ 2/3 de brun pour 1/3 de vert.</p><h3>2. À éviter</h3><p>Viande, os, huile, plantes malades, mauvaises herbes montées en graines, fumier de porc non composté.</p><h3>3. Montage du tas</h3><ol><li>Choisir un endroit ombragé et drainé, fond aéré avec branches.</li><li>Superposer couches de brun et de vert de 10 à 15 cm.</li><li>Arroser : la matière doit rester humide comme une éponge essorée.</li><li>Former un tas d’environ 1,2 m × 1,2 m × 1 m et couvrir.</li></ol><h3>4. Entretien</h3><p>Retourner toutes les 2 à 3 semaines. Le tas chauffe (environ 55 à 65 °C), ce qui aide à détruire une partie des germes. Trop sec : arroser ; odeur forte : aérer et ajouter du brun.</p><h3>5. Maturité et usage</h3><p>Après 2 à 3 mois, le compost est noir, friable, à odeur de sous-bois. Utiliser 1 à 2 brouettées pour 10 m² de planche.</p></div>'},

'<h2>2. Maraîchage</h2>'+tbl("V",hs("100 m²"),FS)+'<h2>3. Cultures de plein champ</h2>'+tbl("F",hs("ha"),FS)+

s("ct",fmt(x.cost));s("rc",fmt(x.rev));s("bn",fmt(x.ben),1);s("mg",x.mg.toFixed(1)+" %",1);s("ya",fmt(x.ben*r.k),1)});

document.getElementById("eo").innerHTML=pic(r.e,r.n,r.kd)+'<ul><li>Quantité : <b>'+fmt(q)+' '+r.u+'</b>, '+k+' cycle(s) par an</li><li>Production estimée : <b>'+fmt(x.un)+(a?' animaux vendus':' kg')+'</b> par cycle</li><li>Coût total : <b>'+fmt(x.cost)+' FCFA</b> par cycle</li><li>Recette : <b>'+fmt(x.rev)+' FCFA</b> par cycle</li><li>Bénéfice : <b class="'+cl+'">'+fmt(x.ben)+' FCFA</b> par cycle, soit <b class="'+cl+'">'+fmt(x.ben*k)+' FCFA</b> par an</li><li>Marge : <b>'+x.mg.toFixed(1)+' %</b> · Retour sur coûts : <b>'+roi.toFixed(1)+' %</b></li><li>Coût de revient : <b>'+fmt(be)+' FCFA</b> par '+(a?'animal vendu':'kg')+' (prix minimum pour ne pas perdre)</li></ul>'}
